# ─────────────────────────────────────────────────────────────────────────────
# Valorant HUD Region-of-Interest definitions
# All coordinates are for 1920×1080.  The ROI system scales them automatically
# for other resolutions.
#
# Format per entry:
#   name:
#     x: left pixel  (inclusive)
#     y: top pixel   (inclusive)
#     w: width
#     h: height
#     enabled: true/false   (easy toggle without deleting)
#     description: human-readable note
# ─────────────────────────────────────────────────────────────────────────────

